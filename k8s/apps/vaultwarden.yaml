---
apiVersion: v1
kind: Namespace
metadata:
  name: services
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-data
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vaultwarden-tailscale-state
  namespace: services
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Mi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vaultwarden-tailscale-serve-config
  namespace: services
data:
  serve.json: |
    {
      "TCP": {
        "443": {
          "HTTPS": true
        }
      },
      "Web": {
        "${TS_CERT_DOMAIN}:443": {
          "Handlers": {
            "/": {
              "Proxy": "http://127.0.0.1:80"
            }
          }
        }
      },
      "AllowFunnel": {
        "${TS_CERT_DOMAIN}:443": false
      }
    }
---
apiVersion: v1
kind: Service
metadata:
  name: vaultwarden
  namespace: services
  labels:
    app: vaultwarden
spec:
  type: ClusterIP
  selector:
    app: vaultwarden
  ports:
    - name: http
      port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vaultwarden
  namespace: services
  labels:
    app: vaultwarden
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: vaultwarden
  template:
    metadata:
      labels:
        app: vaultwarden
    spec:
      containers:
      - name: vaultwarden
        image: vaultwarden/server:1.37.3
        ports:
        - containerPort: 80
          name: http
        env:
        - name: DOMAIN
          value: "https://vaultwarden.tail9a67cd.ts.net"
        - name: SIGNUPS_ALLOWED
          value: "true"
        - name: WEBSOCKET_ENABLED
          value: "true"
        - name: ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: vaultwarden-secrets
              key: ADMIN_TOKEN
              optional: true
        volumeMounts:
        - name: data
          mountPath: /data
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /alive
            port: http
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /alive
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
      - name: tailscale
        image: tailscale/tailscale:v1.102.2
        env:
        - name: TS_AUTHKEY
          valueFrom:
            secretKeyRef:
              name: vaultwarden-tailscale-secrets
              key: TS_AUTHKEY
        - name: TS_HOSTNAME
          value: "vaultwarden"
        - name: TS_STATE_DIR
          value: "/var/lib/tailscale"
        - name: TS_KUBE_SECRET
          value: ""
        - name: TS_SERVE_CONFIG
          value: "/config/serve.json"
        - name: TS_AUTH_ONCE
          value: "true"
        volumeMounts:
        - name: tailscale-state
          mountPath: /var/lib/tailscale
        - name: ts-serve-config
          mountPath: /config
        resources:
          requests:
            memory: "32Mi"
            cpu: "10m"
          limits:
            memory: "128Mi"
            cpu: "200m"
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: vaultwarden-data
      - name: tailscale-state
        persistentVolumeClaim:
          claimName: vaultwarden-tailscale-state
      - name: ts-serve-config
        configMap:
          name: vaultwarden-tailscale-serve-config
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: vaultwarden
  namespace: services
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`vault.cglavin50.com`)
      kind: Rule
      services:
        - name: vaultwarden
          port: 80
  tls:
    store:
      name: default
      namespace: kube-system
