---
apiVersion: v1
kind: Namespace
metadata:
  name: gaming
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minecraft-server-charts
  namespace: gaming
spec:
  interval: 10m
  url: https://itzg.github.io/minecraft-server-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: gaming
spec:
  interval: 15m
  chart:
    spec:
      chart: minecraft
      version: '4.x.x'
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
        namespace: gaming
      interval: 12h
  values:
    livenessProbe:
      command:
        - mc-health
      initialDelaySeconds: 30
      periodSeconds: 60
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 10
    readinessProbe:
      command:
        - mc-health
      initialDelaySeconds: 30
      periodSeconds: 60
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 10
    startupProbe:
      command:
        - mc-health
      enabled: true
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 10
    minecraftServer:
      eula: true
      version: "LATEST"
      difficulty: normal
      whitelist: ""
      ops: ""
      motd: "Coops Minecraft Server :)"
      maxPlayers: 20
      viewDistance: 16
      gameMode: survival
      pvp: true
      serviceType: LoadBalancer
      memory: 10G
      jvmXXOpts: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=50
        -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC
        -XX:G1NewSizePercent=40
        -XX:G1MaxNewSizePercent=60
        -XX:G1HeapRegionSize=16M
        -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5
        -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=40
        -XX:G1MixedGCLiveThresholdPercent=85
        -XX:G1RSetUpdatingPauseTimePercent=5
        -XX:SurvivorRatio=8
        -XX:+PerfDisableSharedMem
        -XX:MaxTenuringThreshold=15
        -XX:+UseStringDeduplication
      type: "FABRIC"
      fabricLauncherVersion: "LATEST"
      modrinth:
        projects:
          - fabric-api
          - lithium
          - ferrite-core
          - carpet
          - spark
          - luckperms
          - fabric-custom-names
      rcon:
        enabled: true
        port: 25575
        existingSecret: minecraft-rcon-secret
        secretKey: rcon-password
    resources:
      requests:
        memory: 10Gi
    persistence:
      dataDir:
        enabled: true
        size: 10Gi
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft-rcon
  namespace: gaming
spec:
  interval: 15m
  chart:
    spec:
      chart: rcon-web-admin
      version: '1.x.x'
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
        namespace: gaming
      interval: 12h
  values:
    resources:
      requests:
        memory: 64Mi
        cpu: 50m
      limits:
        memory: 128Mi
        cpu: 200m
    service:
      type: ClusterIP
    ingress:
      enabled: true
      className: traefik
      host: rcon.cglavin50.com
    rconWeb:
      username: admin
      isAdmin: true
      passwordExistingSecret: minecraft-rcon-secret
      passwordKey: password
      rconPasswordExistingSecret: minecraft-rcon-secret
      rconPasswordKey: rcon-password
      rconHost: minecraft-rcon.gaming.svc.cluster.local
      rconPort: 25575
