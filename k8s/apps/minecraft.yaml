---
apiVersion: v1
kind: Namespace
metadata:
  name: gaming
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: minecraft-server-charts
  namespace: gaming
spec:
  interval: 10m
  url: https://itzg.github.io/minecraft-server-charts/
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: minecraft
  namespace: gaming
spec:
  interval: 15m
  chart:
    spec:
      chart: minecraft
      version: '4.x.x'
      sourceRef:
        kind: HelmRepository
        name: minecraft-server-charts
        namespace: gaming
      interval: 12h
  values:
    livenessProbe:
      command:
        - mc-health
      initialDelaySeconds: 30
      periodSeconds: 60
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 10
    readinessProbe:
      command:
        - mc-health
      initialDelaySeconds: 30
      periodSeconds: 60
      failureThreshold: 3
      successThreshold: 1
      timeoutSeconds: 10
    startupProbe:
      command:
        - mc-health
      enabled: true
      failureThreshold: 30
      periodSeconds: 10
      timeoutSeconds: 10
    minecraftServer:
      eula: true
      version: "1.21.1"
      difficulty: normal
      whitelist: ""
      ops: "LongMan3"
      motd: "Coops Minecraft Server :)"
      maxPlayers: 20
      viewDistance: 16
      gameMode: survival
      pvp: true
      serviceType: LoadBalancer
      memory: 10G
      jvmXXOpts: >-
        -XX:+UseG1GC
        -XX:+ParallelRefProcEnabled
        -XX:MaxGCPauseMillis=50
        -XX:+UnlockExperimentalVMOptions
        -XX:+DisableExplicitGC
        -XX:G1NewSizePercent=40
        -XX:G1MaxNewSizePercent=60
        -XX:G1HeapRegionSize=16M
        -XX:G1ReservePercent=20
        -XX:G1HeapWastePercent=5
        -XX:G1MixedGCCountTarget=4
        -XX:InitiatingHeapOccupancyPercent=40
        -XX:G1MixedGCLiveThresholdPercent=85
        -XX:G1RSetUpdatingPauseTimePercent=5
        -XX:SurvivorRatio=8
        -XX:+PerfDisableSharedMem
        -XX:MaxTenuringThreshold=15
        -XX:+UseStringDeduplication
      type: "NEOFORGE"
      modrinth:
        projects:
          - chunky
          - spark
        allowedVersionType: alpha
      rcon:
        enabled: true
        port: 25575
        existingSecret: minecraft-rcon-secret
        secretKey: rcon-password
    resources:
      requests:
        cpu: "1"
        memory: 10Gi
      limits:
        memory: 12Gi
    persistence:
      dataDir:
        enabled: true
        size: 10Gi
    extraEnv:
      MODS: |
        https://cdn.modrinth.com/data/Vebnzrzj/versions/dKAPoPGd/LuckPerms-NeoForge-5.4.150.jar
